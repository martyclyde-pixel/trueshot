name: Build APK

# Builds an installable debug APK and attaches it to the run so you can
# download it straight onto your phone. Runs on every push, and can be
# started by hand from the Actions tab.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Install the SDK packages this project needs
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Make the Gradle wrapper executable
        # The executable bit does not always survive a zip download.
        run: chmod +x ./gradlew

      - name: Build the debug APK
        # --stacktrace so any failure shows the exact line, not just "failed".
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload the APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TrueShot-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload the build report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/
            build/reports/
          if-no-files-found: ignore
