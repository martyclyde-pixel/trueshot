<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TruShot</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0;
    background: #101012;
    color: #f2efe9;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    box-sizing: border-box;
  }
  main { max-width: 480px; text-align: center; }
  .lockup {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin-bottom: 20px;
  }
  .wordmark {
    font-family: "Baloo 2", sans-serif;
    font-weight: 700;
    font-size: 40px;
    color: #FFD8C8;
  }
  p.tag {
    font-size: 17px;
    color: #c9c9ce;
    line-height: 1.5;
    margin-bottom: 36px;
  }
  .links a {
    display: inline-block;
    color: #101012;
    background: #FFD8C8;
    text-decoration: none;
    font-weight: 600;
    padding: 12px 20px;
    border-radius: 999px;
    margin: 0 6px 12px;
  }
</style>
</head>
<body>
<main>
  <div class="lockup">
    <svg width="48" height="48" viewBox="0 0 108 108">
      <path fill="none" stroke="#FFD8C8" stroke-width="9" d="M76,54 A22,22 0 1,0 32,54 A22,22 0 1,0 76,54"/>
      <path fill="none" stroke="#FFD8C8" stroke-width="9" stroke-linecap="round" d="M54,28 L54,20 M31.5,67 L24.6,71 M76.5,67 L83.4,71"/>
    </svg>
    <div class="wordmark">TruShot</div>
  </div>
  <p class="tag">The camera that shows you exactly what your sensor captured &mdash; no fake HDR, no sharpening, no cosmetic reinterpretation.</p>
  <div class="links">
    <a href="./privacy-policy.html">Privacy Policy</a>
    <a href="./terms.html">Terms &amp; Conditions</a>
  </div>
</main>
</body>
</html>
